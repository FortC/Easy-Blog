# Easy Blog — nginx 参考配置（静态站 + API 反代）
# 适合裸机部署时把静态托管交给 nginx；Docker 单容器部署不需要本文件
# 用法：内容并入现有 nginx 配置，或整段放 /etc/nginx/conf.d/easyblog.conf
# 改两处：server_name 和 root

server {
    listen 80;
    listen [::]:80;
    # 有证书后换：listen 443 ssl http2;  并加 80 → 443 跳转
    server_name  your-domain.com;          # ← 改成你的域名

    root  /var/www/easyblog/public;        # ← 构建产物（源码在 /var/www/easyblog，由 /admin 在线构建）
    index index.html;

    # ---- 性能核心 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # 带指纹的强缓存资源（CSS hash 文件名），一年 immutable
    location /css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # 字体/插画等稳定文件名资源
    location ~* \.(woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    # HTML 协商缓存（改完立刻可见）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- 动态后端：评论 / AI / 站长后台（流式必须关缓冲） ----
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;               # SSE 流式直通
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    # 站长后台（密码在 easyblog-server 侧校验）
    location /admin {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 证书示例（certbot 签发后自动写入）
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_session_cache shared:SSL:5m;
}

# 一键 HTTPS：certbot --nginx -d your-domain.com
