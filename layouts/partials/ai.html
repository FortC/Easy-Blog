{{- /* AI 助手：悬浮按钮 + 面板骨架；chat.js 首次点击时懒加载 */}}
{{- $ai := site.Params.ai }}
{{- if $ai.enabled }}
<button class="ai-fab" type="button" id="ai-fab" aria-label="打开 AI 助手" title="{{ $ai.name }}">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/><path d="M19 15l.9 2.3L22 18l-2.1.7L19 21l-.9-2.3L16 18l2.1-.7z"/></svg>
</button>
<div class="ai-panel" id="ai-panel" role="dialog" aria-label="AI 助手对话" hidden>
  <div class="ai-head">
    <div class="avatar" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>
    </div>
    <div><b>{{ $ai.name }}</b><span>站长养的 AI，问站也聊天</span></div>
    <button class="ai-close" type="button" id="ai-close" aria-label="关闭对话">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="ai-msgs" id="ai-msgs"></div>
  <div class="ai-input">
    <input type="text" id="ai-text" placeholder="{{ $ai.placeholder }}" autocomplete="off" maxlength="500">
    <button type="button" id="ai-send" aria-label="发送">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
</div>
<script>
window.__AI_CFG={name:{{ $ai.name | jsonify }},hello:{{ $ai.hello | jsonify }},site:{{ site.Title | jsonify }}};
(function(){
  var fab=document.getElementById('ai-fab'),loaded=false;
  fab.addEventListener('click',function(){
    if(!loaded){loaded=true;var s=document.createElement('script');s.src='/ai/chat.js';document.body.appendChild(s)}
  });
})();
</script>
{{- end }}
