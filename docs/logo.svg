<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Easy Blog logo">
  <!-- 手作贴纸风 logo：陶土底 + 胶带 + 手写感 EB -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A3A2E" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9A5A3C" opacity="0.25"/>
    </pattern>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-3 256 256)">
    <rect x="56" y="56" width="400" height="400" rx="64" fill="#AE6444"/>
    <rect x="56" y="56" width="400" height="400" rx="64" fill="url(#dots)"/>
    <rect x="56" y="56" width="400" height="400" rx="64" fill="none" stroke="#8C4B31" stroke-width="6" opacity="0.55"/>
  </g>

  <!-- 胶带 -->
  <g transform="rotate(38 150 92)" opacity="0.9">
    <rect x="88" y="74" width="130" height="34" rx="6" fill="#F3E1C8" opacity="0.92"/>
    <rect x="88" y="74" width="130" height="34" rx="6" fill="none" stroke="#D9BC92" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <g transform="rotate(-30 372 428)" opacity="0.9">
    <rect x="306" y="410" width="130" height="34" rx="6" fill="#F3E1C8" opacity="0.92"/>
    <rect x="306" y="410" width="130" height="34" rx="6" fill="none" stroke="#D9BC92" stroke-width="2" stroke-dasharray="6 5"/>
  </g>

  <!-- EB 手写感字组：E 贴纸 + B 荧光笔 -->
  <g transform="rotate(-4 256 268)">
    <text x="128" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="210" font-style="italic" font-weight="700" fill="#F7F1E4">E</text>
    <g transform="rotate(3 330 268)">
      <rect x="228" y="168" width="196" height="164" rx="18" fill="#C08A3E" opacity="0.55"/>
      <text x="252" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="210" font-style="italic" font-weight="700" fill="#F7F1E4">B</text>
    </g>
  </g>

  <!-- 小星星与波浪线 -->
  <path d="M112 400 q 18 -14 36 0 t 36 0" fill="none" stroke="#D9BC92" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#D9BC92" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M404 128 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" transform="rotate(12 404 148)"/>
  </g>
</svg>
