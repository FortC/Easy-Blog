<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Easy Blog — handcrafted Hugo blog with a Go single-binary backend">
  <defs>
    <pattern id="grain" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#8A7C6D" opacity="0.13"/>
      <circle cx="10" cy="9" r="0.7" fill="#8A7C6D" opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4A3A2E" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- 奶油底 + 纸感噪点 -->
  <rect width="1280" height="640" fill="#F7F1E4"/>
  <rect width="1280" height="640" fill="url(#grain)"/>
  <rect x="0" y="0" width="1280" height="10" fill="#AE6444"/>

  <!-- 左：文案 -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
    <text x="84" y="150" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="96" fill="#443830">Easy <tspan fill="#AE6444">Blog</tspan></text>
    <path d="M84 176 q 46 -16 92 0 t 92 0 t 92 0" fill="none" stroke="#C08A3E" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

    <text x="86" y="236" font-size="30" font-weight="700" fill="#443830">手作贴纸风格的轻量博客系统</text>
    <text x="86" y="278" font-size="20" fill="#8A7C6D">Hugo 纯静态前台 · Go 单二进制后端 · Docker 一键部署</text>

    <!-- 特性贴纸 -->
    <g font-size="21" font-weight="700">
      <g transform="rotate(-2 86 356)" filter="url(#soft)">
        <rect x="86" y="326" width="150" height="52" rx="8 20 14 22" fill="#AE6444"/>
        <text x="161" y="360" text-anchor="middle" fill="#F7F1E4">⚡ 秒开 · 15KB</text>
      </g>
      <g transform="rotate(1.5 262 352)">
        <rect x="262" y="328" width="132" height="50" rx="14 8 22 10" fill="#F3E1C8" stroke="#C08A3E" stroke-width="2"/>
        <text x="328" y="361" text-anchor="middle" fill="#8C4B31">在线后台</text>
      </g>
      <g transform="rotate(-1 428 356)">
        <rect x="428" y="330" width="132" height="50" rx="18 10 8 20" fill="#F3E1C8" stroke="#C08A3E" stroke-width="2"/>
        <text x="494" y="363" text-anchor="middle" fill="#8C4B31">访客评论</text>
      </g>
      <g transform="rotate(2 96 424)">
        <rect x="86" y="398" width="150" height="50" rx="10 22 12 18" fill="#F3E1C8" stroke="#C08A3E" stroke-width="2"/>
        <text x="161" y="431" text-anchor="middle" fill="#8C4B31">AI 助手 · 可选</text>
      </g>
      <g transform="rotate(-1.5 268 426)">
        <rect x="262" y="402" width="160" height="48" rx="20 10 16 22" fill="#FDFBF5" stroke="#AE6444" stroke-width="2" stroke-dasharray="7 5"/>
        <text x="342" y="434" text-anchor="middle" fill="#443830">docker compose up</text>
      </g>
    </g>

    <text x="86" y="540" font-size="19" fill="#8A7C6D">2 核 2G 小服务器友好 · 零数据库 · MIT</text>
  </g>

  <!-- 右：浏览器窗口贴纸 -->
  <g transform="rotate(1.6 900 330)" filter="url(#soft)">
    <rect x="648" y="96" width="548" height="448" rx="18" fill="#FDFBF5" stroke="#4A3A2E" stroke-width="3"/>
    <rect x="648" y="96" width="548" height="46" rx="18" fill="#EFE2CE"/>
    <rect x="648" y="126" width="548" height="16" fill="#EFE2CE"/>
    <circle cx="678" cy="119" r="7" fill="#AE6444"/>
    <circle cx="702" cy="119" r="7" fill="#C08A3E"/>
    <circle cx="726" cy="119" r="7" fill="#D9BC92"/>
    <!-- hero 区 -->
    <rect x="676" y="168" width="330" height="120" rx="14" fill="#AE6444"/>
    <rect x="694" y="188" width="200" height="16" rx="8" fill="#F7F1E4" opacity="0.92"/>
    <rect x="694" y="216" width="260" height="10" rx="5" fill="#D9BC92" opacity="0.9"/>
    <rect x="694" y="236" width="230" height="10" rx="5" fill="#D9BC92" opacity="0.7"/>
    <circle cx="1030" cy="228" r="34" fill="#C08A3E"/>
    <path d="M1016 222 q 14 -10 28 0 q -4 18 -14 26 q -10 -8 -14 -26 z" fill="#F3E1C8"/>
    <!-- 卡片 -->
    <g>
      <rect x="676" y="312" width="152" height="102" rx="10 16 12 14" fill="#F3E1C8" stroke="#C08A3E" stroke-width="2" transform="rotate(-1.5 752 363)"/>
      <rect x="852" y="316" width="150" height="98" rx="14 10 16 12" fill="#FDFBF5" stroke="#AE6444" stroke-width="2" transform="rotate(1.2 927 365)"/>
      <rect x="1024" y="312" width="148" height="102" rx="12 18 10 16" fill="#EFE2CE" stroke="#9A6A24" stroke-width="2" transform="rotate(-1 1098 363)"/>
      <rect x="694" y="336" width="110" height="10" rx="5" fill="#8C4B31" opacity="0.7"/>
      <rect x="694" y="358" width="80" height="8" rx="4" fill="#9A6A24" opacity="0.6"/>
      <rect x="870" y="340" width="110" height="10" rx="5" fill="#8C4B31" opacity="0.7"/>
      <rect x="870" y="362" width="84" height="8" rx="4" fill="#9A6A24" opacity="0.6"/>
      <rect x="1042" y="336" width="106" height="10" rx="5" fill="#8C4B31" opacity="0.7"/>
      <rect x="1042" y="358" width="78" height="8" rx="4" fill="#9A6A24" opacity="0.6"/>
    </g>
    <!-- 底部便利贴 -->
    <rect x="676" y="438" width="200" height="72" rx="8" fill="#F3E1C8" stroke="#D9BC92" stroke-width="2" transform="rotate(-1 776 474)"/>
    <path d="M700 470 q 30 -14 60 0 t 60 0 t 40 0" fill="none" stroke="#8C4B31" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <rect x="900" y="442" width="272" height="64" rx="8" fill="#EFE2CE"/>
    <rect x="918" y="462" width="200" height="9" rx="4" fill="#8A7C6D" opacity="0.6"/>
    <rect x="918" y="482" width="150" height="9" rx="4" fill="#8A7C6D" opacity="0.45"/>
  </g>

  <!-- 胶带：贴在窗口右上角 -->
  <g transform="rotate(40 1136 108)">
    <rect x="1074" y="88" width="128" height="34" rx="6" fill="#F3E1C8" opacity="0.95"/>
    <rect x="1074" y="88" width="128" height="34" rx="6" fill="none" stroke="#D9BC92" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <!-- 小贴纸星星 -->
  <g transform="rotate(14 628 540)">
    <path d="M628 512 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9 z" fill="#C08A3E"/>
  </g>
</svg>
